on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload the assets for
        required: true
name: release-please

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - name: Build
        run: |
          npm ci
          npm test
          npm run build
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ github.event_name == 'push' }}
        id: release
      # Chunks first: the entry is what HACS installs, so it must never be on the release without them.
      - name: Upload Release Artifacts
        if: ${{ steps.release.outputs.release_created || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(dist/ha-sankey-chart-*.js)
          gh release delete-asset "$TAG_NAME" ha-sankey-chart.js --yes 2>/dev/null || true
          if [ ${#chunks[@]} -gt 0 ]; then gh release upload "$TAG_NAME" "${chunks[@]}" --clobber; fi
          gh release upload "$TAG_NAME" dist/ha-sankey-chart.js --clobber
          diff <(cd dist && ls -1 *.js | sort) <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | sort)

  hacs-validate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HACS Validate
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: plugin
